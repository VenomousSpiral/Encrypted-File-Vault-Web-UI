services:
  vault:
    build: .
    container_name: encrypted-vault
    restart: unless-stopped
    ports:
      - "${PORT:-5575}:5575"
    # Map ./data on host → /app/data inside container so vault files stay under project/data/
    volumes:
      - ${DATA_DIR_ON_HOST:-./data}:${DOCKER_DATA_DIR:-/app/data}
    tmpfs:
      - /tmp/hls:rw,noexec,nosuid,size=${TMPFS_SIZE:-8g}
    env_file:
      - .env
    environment:
      - DATA_DIR=${DOCKER_DATA_DIR:-/app/data}
      - TEMP_DIR=/tmp/hls

# Using a host bind mount for the vault data; no named volume required.
