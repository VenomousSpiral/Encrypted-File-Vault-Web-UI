{% extends "base.html" %}
{% block title %}{{ file.name }} — Encrypted Vault{% endblock %}

{% block head %}
<style>
    .cbz-page {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 120px);
        object-fit: contain;
        margin: 0 auto;
        user-select: none;
        -webkit-user-drag: none;
    }
    .cbz-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 76px);
        background: #1a1a1a;
    }
    .cbz-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid #333;
        background: #0d0d0d;
        flex-wrap: wrap;
    }
    .cbz-toolbar .page-input {
        width: 70px;
        text-align: center;
        background: #222;
        border: 1px solid #444;
        color: #fff;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 0.9rem;
    }
    .cbz-toolbar .page-input:focus {
        outline: none;
        border-color: #0d6efd;
        background: #2a2a2a;
    }
    .cbz-toolbar .page-total {
        color: #8b949e;
        font-size: 0.85rem;
        white-space: nowrap;
    }
    .cbz-toolbar .btn { min-width: 36px; }
    .cbz-image-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }
    .cbz-image-area img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    .cbz-loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #8b949e;
    }
    .cbz-filename {
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        flex-grow: 1;
        min-width: 0;
        font-size: 0.9rem;
    }
    /* Click zones for page turning */
    .click-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        cursor: pointer;
        z-index: 5;
    }
    .click-zone-left { left: 0; }
    .click-zone-right { right: 0; }
</style>
{% endblock %}

{% block content %}
<div class="cbz-container">
    <!-- Toolbar -->
    <div class="cbz-toolbar">
        <a href="{{ url_for('explorer') }}{% if file.parent_id is not none %}?parent_id={{ file.parent_id }}{% endif %}" class="btn btn-sm btn-outline-secondary" title="Back to files">
            <i class="fas fa-arrow-left"></i>
        </a>
        <span class="cbz-filename text-truncate" title="{{ file.name }}">{{ file.name }}</span>

        <button class="btn btn-sm btn-outline-secondary" id="prevBtn" title="Previous page">
            <i class="fas fa-chevron-left"></i>
        </button>

        <input type="number" class="page-input" id="pageInput" min="1" value="1"
               title="Go to page">

        <span class="page-total" id="pageTotal">/ ?</span>

        <button class="btn btn-sm btn-outline-secondary" id="nextBtn" title="Next page">
            <i class="fas fa-chevron-right"></i>
        </button>

        <a href="{{ url_for('download_file', file_id=file.id) }}" class="btn btn-sm btn-outline-primary" title="Download">
            <i class="fas fa-download"></i>
        </a>
    </div>

    <!-- Image display area -->
    <div class="cbz-image-area" id="imageArea">
        <div class="cbz-loading" id="loadingIndicator">
            <div class="spinner-border text-primary mb-2" role="status" style="width:2rem;height:2rem">
                <span class="visually-hidden">Loading…</span>
            </div>
            <p class="mb-0 small">Loading page…</p>
        </div>
        <img id="cbzImage" class="cbz-page" alt="CBZ page" style="display:none">
        <div class="click-zone click-zone-left" id="clickLeft" title="Previous page"></div>
        <div class="click-zone click-zone-right" id="clickRight" title="Next page"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script>window.__CBZ_CONFIG = { fileId: {{ file.id }}, initialPage: {{ cbz_prefs.get('page', 0) }} };</script>
    <script src="{{ url_for('static', filename='js/cbz.js') }}"></script>
{% endblock %}
