{% extends "base.html" %}
{% block title %}{{ file.name }} — Editor{% endblock %}

{% block head %}
<style>
    .editor-page { height: calc(100vh - 56px); display: flex; flex-direction: column; }

    .editor-toolbar {
        display: flex; align-items: center; gap: .75rem;
        padding: .5rem .75rem;
        border-bottom: 1px solid var(--bs-border-color);
        background: var(--bs-dark);
        flex-shrink: 0;
    }

    .save-status {
        font-size: .75rem;
        display: flex; align-items: center; gap: .35rem;
        min-width: 100px;
    }
    .save-status .dot {
        width: 8px; height: 8px; border-radius: 50%;
        display: inline-block;
    }
    .save-status.saved    .dot { background: #22c55e; }
    .save-status.saving   .dot { background: #f59e0b; }
    .save-status.unsaved  .dot { background: #ef4444; }
    .save-status.error    .dot { background: #ef4444; }
    .save-status.loading  .dot { background: #6b7280; }

    .editor-wrap {
        flex: 1; display: flex; position: relative;
        min-height: 0;
        overflow: hidden;
    }

    .line-numbers {
        width: 50px; flex-shrink: 0;
        background: #1a1a2e;
        color: #6b7280;
        font-family: 'Source Code Pro', 'DejaVu Sans Mono', 'Courier New', monospace;
        font-size: .875rem;
        line-height: 1.6;
        padding: .75rem .5rem .75rem 0;
        text-align: right;
        overflow: hidden;
        user-select: none;
        border-right: 1px solid #2d2d44;
        white-space: pre;
    }

    #editor {
        flex: 1;
        background: #0d1117;
        color: #e6edf3;
        font-family: 'Source Code Pro', 'DejaVu Sans Mono', 'Courier New', monospace;
        font-size: .875rem;
        line-height: 1.6;
        padding: .75rem 1rem;
        border: none; outline: none;
        resize: none;
        overflow: auto;
        white-space: pre;
        tab-size: 4;
        -moz-tab-size: 4;
    }

    #editor:focus { box-shadow: none; }

    /* Scrollbar */
    #editor::-webkit-scrollbar { width: 10px; height: 10px; }
    #editor::-webkit-scrollbar-track { background: #161b22; }
    #editor::-webkit-scrollbar-thumb { background: #30363d; border-radius: 5px; }
    #editor::-webkit-scrollbar-thumb:hover { background: #484f58; }

    .editor-footer {
        display: flex; align-items: center; justify-content: space-between;
        padding: .25rem .75rem;
        border-top: 1px solid var(--bs-border-color);
        background: #161b22;
        font-size: .75rem;
        color: #8b949e;
        flex-shrink: 0;
        flex-wrap: wrap;
        gap: .25rem;
    }

    .word-wrap-toggle {
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 3px;
        user-select: none;
    }
    .word-wrap-toggle:hover { background: #30363d; }
    .word-wrap-toggle.active { color: #58a6ff; }

    /* Link bar – floats inside editor area near cursor */
    .link-bar {
        display: none;
        align-items: center; gap: .5rem;
        padding: .3rem .75rem;
        background: rgba(28, 33, 40, 0.95);
        border: 1px solid #30363d;
        border-radius: 6px;
        font-size: .8rem;
        position: absolute;
        z-index: 10;
        left: 60px;
        max-width: calc(100% - 80px);
        box-shadow: 0 4px 12px rgba(0,0,0,.4);
        pointer-events: auto;
        backdrop-filter: blur(8px);
    }
    .link-bar.visible { display: flex; }
    .link-bar a {
        color: #58a6ff;
        text-decoration: underline;
        max-width: 80%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 4px 0;
    }
    .link-bar a:hover { color: #79c0ff; }
    .link-bar .link-hint {
        color: #6b7280;
        font-size: .7rem;
        margin-left: auto;
    }

    /* Mobile editor adjustments */
    @media (max-width: 576px) {
        .line-numbers {
            width: 36px;
            font-size: 16px;       /* match editor font-size to keep lines aligned */
            padding-right: .25rem;
            padding-top: .5rem;    /* match editor padding */
            padding-bottom: .5rem;
        }
        #editor { font-size: 16px; padding: .5rem; }  /* 16px prevents iOS zoom on focus */
        .editor-toolbar { gap: .5rem; padding: .35rem .5rem; }
        .editor-footer { font-size: .65rem; padding: .2rem .5rem; }
        .link-bar { font-size: .75rem; padding: .35rem .5rem; left: 44px; max-width: calc(100% - 56px); }
        .link-bar a { max-width: 65%; font-size: .75rem; padding: 6px 0; }
    }
</style>
{% endblock %}

{% block content %}
<div class="editor-page">
    <!-- Toolbar -->
    <div class="editor-toolbar">
        <a href="{{ url_for('explorer') }}{% if file.parent_id is not none %}?parent_id={{ file.parent_id }}{% endif %}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left"></i>
        </a>
        <span class="text-truncate fw-semibold flex-grow-1" title="{{ file.name }}">{{ file.name }}</span>

        <div class="save-status loading" id="saveStatus">
            <span class="dot"></span>
            <span class="save-text">Loading…</span>
        </div>

        <!-- File navigation -->
        <div class="audio-top-nav d-flex align-items-center gap-1">
            <span id="navPos" style="font-size:.75rem;color:var(--bs-secondary-color);white-space:nowrap"></span>
            <button class="btn btn-sm btn-outline-secondary nav-btn" id="prevBtn" title="Previous">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary nav-btn" id="nextBtn" title="Next">
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary shuffle-btn active" id="shuffleBtn" title="Shuffle">
                <i class="fas fa-random"></i>
            </button>
            <button class="btn btn-sm btn-outline-success recurse-btn active nav-btn" id="recurseBtn" title="Toggle recursive navigation (spans subdirectories)">
                <i class="fas fa-layer-group me-1"></i><span class="d-none d-md-inline">Recursive</span>
            </button>
        </div>

        <a href="{{ url_for('download_file', file_id=file.id) }}" class="btn btn-sm btn-outline-primary" title="Download">
            <i class="fas fa-download"></i>
        </a>
    </div>

    <!-- Editor area -->
    <div class="editor-wrap">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        <!-- Link bar (floats near cursor when on a URL) -->
        <div class="link-bar" id="linkBar">
            <i class="fas fa-link" style="color:#6b7280"></i>
            <a id="linkBarUrl" href="#" target="_blank" rel="noopener noreferrer"></a>
            <span class="link-hint" id="linkHint"></span>
        </div>
    </div>

    <!-- Footer -->
    <div class="editor-footer">
        <div>
            <span id="cursorPos">Ln 1, Col 1</span>
            <span class="mx-2">|</span>
            <span id="fileSize">0 B</span>
            <span class="mx-2">|</span>
            <span id="lineCount">0 lines</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="word-wrap-toggle" id="wrapToggle" title="Toggle word wrap">
                <i class="fas fa-text-width me-1"></i>Wrap
            </span>
            <span>UTF-8</span>
        </div>
    </div>
</div>

<script>window.__EDITOR_CONFIG = { fileId: {{ file.id }} }; window.__PLAYER_CONFIG = { fileId: {{ file.id }} };</script>
<script src="{{ url_for('static', filename='js/file-nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
