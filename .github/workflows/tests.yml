name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # Install runtime deps needed for core module imports + test tools
          pip install -r requirements.txt pytest ruff
      
      - name: Layer 1 — Core module imports (flask available)
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_helper_imports.py::TestCoreModuleImports -v
        
      - name: Layer 2 — Ruff unused imports (F401 only)
        run: |
          source .venv/bin/activate
          ruff check --select=F401 core/
      
      - name: Layer 3a — Core module alias consistency checks
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_helper_direct.py::TestCoreModuleStructure -v
        
      - name: Layer 3b — Core module defense chain (no empty dir gaps)
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_helper_direct.py::TestCoreModuleCoverage -v
