name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # Install only what's needed for tests (no app runtime deps)
          pip install pytest ruff
      
      - name: Layer 1 — Module-level imports
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_helper_imports.py::TestHelperImports -v
        
      - name: Layer 2 — Ruff F401 (unused imports)  
        run: |
          source .venv/bin/activate
          ruff check --select=F401 helpers/app_helpers_files.py
      
      - name: Layer 3a — Alias consistency + missing names
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_helper_direct.py::TestAliasConsistencyEnhanced -v
        
      - name: Layer 3b — Defense chain integrity  
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_helper_direct.py::TestDefenseChainIntegrity -v
